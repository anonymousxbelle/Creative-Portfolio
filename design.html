    <style>
        .artwork-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; column-count: auto; align-items: start; }

    <a  href ="index.html" class="logo">Toyosi Ajiboye</a>

    </button>

        <a href="artwork.html">Artwork</a>
        <a href="photos.html">Photography</a>

    <section class="design-banner">
        <div class="design-banner-inner">
            <h1>Graphic Design</h1>

        </div>

    <section class="artwork-section fade-in">
        <div class="artwork-grid">
